<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#FFC531">
<!--APP:START-->
<title>Turma do Hello</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: uma coluna de celular (até 560px). Nada depende de leitura: figura grande, voz e botões com desenho. */
:root{
  --bg:#E4F3FF; --surface:#FFFFFF; --fg:#14213D; --muted:#51607F; --line:#14213D;
  --sun:#FFC531; --coral:#FF6B81; --leaf:#3CCB7F; --blue:#5B8CFF; --grape:#B18CFF; --aqua:#3FD0C9;
  --on-color:#14213D;
  --display:"Baloo 2","Nunito","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  --r:26px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0E1630;--surface:#1B2750;--fg:#F2F5FF;--muted:#A9B5D6;--line:#050916;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0E1630;--surface:#1B2750;--fg:#F2F5FF;--muted:#A9B5D6;--line:#050916;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:500 17px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font:800 2.1rem/1.05 var(--display);margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted);font-size:.92rem}

button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,summary:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-width:68px;min-height:68px;padding:0 18px;font-size:2rem;line-height:1;
  background:var(--c,var(--sun));color:var(--on-color);border:3px solid var(--line);border-radius:50px;
  box-shadow:0 6px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn:active,.tile:active,.choice:active,.card:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.btn.ghost{background:var(--surface);color:var(--fg)}
.btn.go{--c:var(--leaf);min-width:140px;min-height:84px;font-size:2.6rem}
.btn.huge{--c:var(--leaf);width:150px;height:150px;border-radius:50%;font-size:4.5rem;padding-left:28px}

.top{display:flex;align-items:center;gap:12px}
.top h1{flex:1;min-width:0}
.total{font:800 1.2rem var(--display);background:var(--surface);border:3px solid var(--line);border-radius:999px;padding:4px 14px;white-space:nowrap}
.bar{flex:1;min-width:40px;height:22px;background:var(--surface);border:3px solid var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);transition:width .4s}

.avatar{flex:none;width:96px;height:96px;border-radius:50%;background:var(--c,var(--sun));border:3px solid var(--line);box-shadow:0 5px 0 var(--line);overflow:hidden}
.avatar.big{width:170px;height:170px}
.avatar svg{display:block;width:100%;height:100%}
.avatar.talking{animation:bob .5s ease-in-out infinite alternate}
.hero{display:flex;align-items:center;gap:14px}
.bubble{flex:1;min-width:0;position:relative;background:var(--surface);border:3px solid var(--line);border-radius:var(--r);padding:12px 16px;font:800 1.5rem/1.15 var(--display)}
.bubble::before{content:"";position:absolute;left:-11px;top:calc(50% - 8px);width:16px;height:16px;background:var(--surface);border-left:3px solid var(--line);border-bottom:3px solid var(--line);transform:rotate(45deg)}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:160px;padding:12px;
  background:var(--c);color:var(--on-color);border:3px solid var(--line);border-radius:var(--r);box-shadow:0 6px 0 var(--line);transition:transform .08s,box-shadow .08s}
.tile .emo{font-size:4rem;line-height:1.1}
.tile .t{font:800 1.3rem/1.1 var(--display)}
.tile .st{font-size:1.3rem;letter-spacing:3px}

.card{background:var(--surface);border:3px solid var(--line);border-radius:32px;box-shadow:0 7px 0 var(--line);padding:26px 16px;min-height:300px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .08s,box-shadow .08s}
.card .word{font:800 2.6rem/1.1 var(--display)}
.pic{font-size:8rem;line-height:1.1}
.pic.sw{width:170px;height:170px;border-radius:50%;border:3px solid var(--line)}
.pic.num{font:800 7rem/1 var(--display);color:var(--blue);display:flex;flex-direction:column;align-items:center}
.pic.num span{font-size:.3em;letter-spacing:.12em;color:var(--coral);max-width:5.2em;text-align:center;line-height:1.1;overflow-wrap:anywhere}
.row{display:flex;gap:14px;align-items:center;justify-content:center}

.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.choices.two{grid-template-columns:1fr}
.choice{background:var(--surface);border:3px solid var(--line);border-radius:var(--r);box-shadow:0 6px 0 var(--line);
  min-height:160px;display:flex;align-items:center;justify-content:center;padding:10px;transition:transform .08s,box-shadow .08s}
.choices .choice:last-child:nth-child(odd){grid-column:1/-1}
.choice .pic{font-size:5rem}.choice .pic.sw{width:104px;height:104px}.choice .pic.num{font-size:4.4rem}
.ok{background:var(--leaf)!important;animation:pop .5s}
.bad{opacity:.3;animation:shake .35s}
.btn.mic{--c:var(--coral);min-width:84px;min-height:84px;font-size:2.6rem}
.btn.mic.on{animation:pulse .5s ease-in-out infinite alternate}
.count{font:800 1.25rem var(--display);background:var(--surface);border:3px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap}
.count.bump{animation:pop .5s}
.card{position:relative}
.badge{position:absolute;top:12px;right:14px;font-size:3rem;line-height:1;animation:pop .5s}
.btn.said{--c:var(--leaf);min-width:120px;min-height:84px;font-size:2.8rem;animation:pulse .7s ease-in-out 4s infinite alternate}
.btn.rep{min-width:84px;min-height:84px;font-size:2.4rem}
.fx{position:fixed;inset:0;pointer-events:none;z-index:20;display:flex;align-items:center;justify-content:center;overflow:hidden}
.fx b{font-size:9rem;line-height:1;animation:starfly 1.3s ease-out forwards}
.fx i{position:absolute;left:50%;top:50%;font-style:normal;font-size:2rem;animation:burst 1.2s ease-out forwards}
@keyframes starfly{0%{transform:scale(.2) rotate(-40deg);opacity:0}30%{transform:scale(1.15) rotate(8deg);opacity:1}60%{transform:scale(1) rotate(0)}100%{transform:scale(.3) translate(60vw,-120vh);opacity:0}}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.2) rotate(var(--r));opacity:0}}
.hint{animation:pulse .7s ease-in-out infinite alternate}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes pulse{to{transform:scale(1.06);background:var(--sun)}}
@keyframes bob{to{transform:translateY(-6px) rotate(3deg)}}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px}
.bigstars{font-size:4rem;letter-spacing:8px;animation:pop .6s}
details{background:var(--surface);border:2px dashed var(--muted);border-radius:16px;padding:10px 14px}
summary{font-weight:800;cursor:pointer}
details p{margin-top:8px}
audio{display:none}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<div id="live" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div>

<script>
/* ---------- Personagens originais (SVG) ---------- */
const CH = {
  bolt: { name: 'Bolt', color: 'var(--sun)', svg: `
    <svg viewBox="0 0 120 120" aria-hidden="true"><g stroke="#14213D" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <line x1="60" y1="14" x2="60" y2="30" fill="none"/><circle cx="60" cy="12" r="6" fill="#FF6B81"/>
    <rect x="16" y="52" width="12" height="22" rx="5" fill="#FF6B81"/><rect x="92" y="52" width="12" height="22" rx="5" fill="#FF6B81"/>
    <rect x="26" y="30" width="68" height="60" rx="18" fill="#3FD0C9"/>
    <circle cx="46" cy="56" r="11" fill="#fff"/><circle cx="74" cy="56" r="11" fill="#fff"/>
    <circle cx="48" cy="58" r="4" fill="#14213D"/><circle cx="76" cy="58" r="4" fill="#14213D"/>
    <path d="M46 74 Q60 86 74 74" fill="#fff"/>
    <rect x="40" y="94" width="40" height="30" rx="8" fill="#3FD0C9"/></g></svg>` },
  luna: { name: 'Luna', color: 'var(--grape)', svg: `
    <svg viewBox="0 0 120 120" aria-hidden="true"><g stroke="#14213D" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="60" cy="58" r="46" fill="#EAF6FF"/>
    <path d="M32 44 L34 18 L54 34 Z" fill="#FF9F43"/><path d="M88 44 L86 18 L66 34 Z" fill="#FF9F43"/>
    <ellipse cx="60" cy="62" rx="32" ry="28" fill="#FF9F43"/>
    <circle cx="47" cy="58" r="5" fill="#14213D"/><circle cx="73" cy="58" r="5" fill="#14213D"/>
    <path d="M56 68 L64 68 L60 73 Z" fill="#FF6B81"/>
    <path d="M60 73 Q54 82 48 76 M60 73 Q66 82 72 76" fill="none"/>
    <path d="M22 100 Q60 122 98 100 L98 124 L22 124 Z" fill="#fff"/></g></svg>` },
  tuco: { name: 'Tuco', color: 'var(--leaf)', svg: `
    <svg viewBox="0 0 120 120" aria-hidden="true"><g stroke="#14213D" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="50" cy="78" rx="30" ry="38" fill="#2B2F4A"/>
    <ellipse cx="50" cy="88" rx="17" ry="24" fill="#fff"/>
    <circle cx="52" cy="42" r="24" fill="#2B2F4A"/>
    <path d="M68 30 Q112 26 112 54 Q96 62 70 54 Z" fill="#FFC531"/>
    <path d="M100 30 Q113 36 112 54 Q104 56 98 52 Z" fill="#FF6B81"/>
    <line x1="70" y1="44" x2="110" y2="46" fill="none"/>
    <circle cx="54" cy="38" r="9" fill="#fff"/><circle cx="56" cy="38" r="4" fill="#14213D"/></g></svg>` }
};

/* ---------- Conteúdo: 6 lições, 6 palavras cada, tudo concreto e desenhável ---------- */
// palavra: [inglês, figura]  (figura = emoji, cor CSS ou número). pt = tema falado em português.
const UNITS = [
  { id:'animals', t:'Animals', pt:'os animais', emo:'🐶', host:'tuco', c:'var(--leaf)', words:[
      ['dog','🐶'],['cat','🐱'],['fish','🐟'],['bird','🐦'],['cow','🐮'],['lion','🦁']]},
  { id:'colors', t:'Colors', pt:'as cores', emo:'🎨', host:'luna', c:'var(--coral)', kind:'sw', words:[
      ['red','#E63946'],['blue','#2F6BFF'],['yellow','#FFD60A'],['green','#2BB673'],['orange','#FF8C1A'],['pink','#FF7EB6']]},
  { id:'numbers', t:'Numbers', pt:'os números', emo:'🖐️', host:'bolt', c:'var(--blue)', kind:'num', words:[
      ['one',1],['two',2],['three',3],['four',4],['five',5],['six',6]]},
  { id:'food', t:'Food', pt:'as comidas', emo:'🍎', host:'luna', c:'var(--grape)', words:[
      ['apple','🍎'],['banana','🍌'],['milk','🥛'],['bread','🍞'],['egg','🥚'],['cheese','🧀']]},
  { id:'toys', t:'Toys', pt:'os brinquedos', emo:'🧸', host:'bolt', c:'var(--sun)', words:[
      ['ball','⚽'],['car','🚗'],['teddy bear','🧸'],['robot','🤖'],['book','📕'],['kite','🪁']]},
  { id:'body', t:'Body', pt:'o corpo', emo:'✋', host:'tuco', c:'var(--aqua)', words:[
      ['eye','👁️'],['ear','👂'],['nose','👃'],['mouth','👄'],['hand','✋'],['foot','🦶']]}
];

/* ---------- Progresso (fica só neste aparelho) ---------- */
let store = { stars:{}, total:0 };   // stars = nota da lição (1 a 3); total = estrelinhas ganhas a cada acerto
try { Object.assign(store, JSON.parse(localStorage.getItem('turma-hello') || '{}')); store.stars = store.stars || {}; store.total = store.total || 0; } catch (e) {}
const save = () => { try { localStorage.setItem('turma-hello', JSON.stringify(store)); } catch (e) {} };

/* ---------- Som: falas gravadas (pasta audio/). Instruções em português, palavras em inglês. ---------- */
const player = new Audio(); player.preload = 'auto';
let playId = 0;
const wid = w => 'w-' + w[0].replace(/ /g, '-');
// say('yes', 'w-dog', 'p1') toca as gravações em sequência.
function say(...ids) {
  const my = ++playId; let i = 0;
  const end = () => { if (my === playId) talking(false); };
  const next = () => {
    if (my !== playId) return;
    if (i >= ids.length) return end();
    player.src = 'audio/' + ids[i++] + '.mp3';
    player.onended = next; player.onerror = next;
    const p = player.play(); if (p) p.catch(end);
  };
  talking(true); next();
}
function hush() { playId++; try { player.pause(); } catch (e) {} talking(false); }
const talking = on => { const a = document.querySelector('.avatar'); if (a) a.classList.toggle('talking', on); };

/* ---------- Microfone: confere se a criança falou a palavra ---------- */
// Funciona no Chrome (computador ou Android). Onde não houver, o botão do microfone não aparece.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let dict = null, micOff = false;
try { if (window.claude && window.claude.use) window.claude.use('dictation').then(d => { dict = d; }).catch(() => {}); } catch (e) {}
const canListen = () => !micOff && !!(dict || SR);
// Outras formas que o reconhecedor costuma escrever a mesma palavra.
const ALT = { one:['1','won'], two:['2','to','too'], three:['3','tree','free'], four:['4','for'], five:['5'], six:['6','sex','sick'],
  eye:['i','hi','aye'], ear:['year','here'], red:['read','bread'], blue:['blew','boo'], bread:['bred','red'], foot:['food','put'],
  'teddy bear':['teddy','bear'], cow:['cal','how'], kite:['kyte','kate','kit'], ball:['bowl','bow'], car:['ka','cars'], hand:['and','hands'],
  nose:['knows','no'], mouth:['mouse'], cat:['cut','kat'], fish:['fiche'], egg:['ag','eggs'], book:['buk','books'], pink:['pinky','ping'] };
const heard = (text, word) => {
  const t = ' ' + text.toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ') + ' ';
  return [word, word + 's', ...(ALT[word] || [])].some(x => t.includes(' ' + x + ' '));
};
// Chame direto do toque no botão. done(true|false) = falou certo ou não; done(null) = microfone indisponível.
function listen(word, done) {
  let text = '', finished = false, stop = () => {};
  const finish = r => { if (finished) return; finished = true; clearTimeout(t); stop(); done(r); };
  const check = () => { if (heard(text, word)) finish(true); };
  const t = setTimeout(() => finish(false), 6000);
  if (dict) {
    let final = '';
    const offs = [dict.onPartial(e => { text = final + ' ' + e.text; check(); }), dict.onFinal(e => { final += e.text; text = final; check(); })];
    stop = () => { offs.forEach(f => f()); dict.stop().catch(() => {}); };
    dict.start({ language: 'en' }).catch(e => {
      if (e && (e.code === 'not_granted' || e.code === 'unavailable')) micOff = true;
      finish(e && e.code === 'stopped' ? false : null);
    });
  } else {
    let r;
    try {
      r = new SR(); r.lang = 'en-US'; r.interimResults = true; r.maxAlternatives = 5;
      r.onresult = e => { text = [...e.results].map(x => [...x].map(a => a.transcript).join(' ')).join(' '); check(); };
      r.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { micOff = true; finish(null); } else if (e.error !== 'no-speech' && e.error !== 'aborted') finish(null); };
      r.onend = () => finish(heard(text, word));
      stop = () => { try { r.abort(); } catch (e) {} };
      r.start();
    } catch (e) { micOff = true; finish(null); }
  }
  return () => finish(false);
}

/* ---------- Utilidades ---------- */
const app = document.getElementById('app'), live = document.getElementById('live');
const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const praise = () => 'p' + (1 + Math.floor(Math.random() * 6));
const ding = new Audio('audio/ding.mp3'); ding.preload = 'auto';
// Festa a cada acerto: estrela grande, confete e um sininho.
function party(big) {
  try { ding.currentTime = 0; const p = ding.play(); if (p) p.catch(() => {}); } catch (e) {}
  const fx = document.createElement('div'); fx.className = 'fx'; fx.setAttribute('aria-hidden', 'true');
  const bits = ['⭐', '🎉', '✨', '🎈', '⭐', '💛', '✨', '🎉'];
  fx.innerHTML = '<b>⭐</b>' + Array.from({ length: big ? 22 : 12 }, (_, k) => {
    const a = Math.random() * 6.28, d = 120 + Math.random() * 220;
    return `<i style="--x:${Math.cos(a) * d}px;--y:${Math.sin(a) * d}px;--r:${Math.random() * 360 - 180}deg">${bits[k % bits.length]}</i>`;
  }).join('');
  document.body.appendChild(fx);
  setTimeout(() => fx.remove(), 1400);
}
const starStr = n => '★'.repeat(n) + '☆'.repeat(3 - n);
const avatar = (id, big) => `<div class="avatar${big ? ' big' : ''}" style="--c:${CH[id].color}">${CH[id].svg}</div>`;
const pic = (u, w) => u.kind === 'sw' ? `<div class="pic sw" style="background:${w[1]}"></div>`
  : u.kind === 'num' ? `<div class="pic num">${w[1]}<span>${'●'.repeat(w[1])}</span></div>` : `<div class="pic">${w[1]}</div>`;
let timers = [], cancelListen = null;
const later = (fn, ms) => timers.push(setTimeout(fn, ms));
function show(html) {
  timers.forEach(clearTimeout); timers = [];
  if (cancelListen) { const c = cancelListen; cancelListen = null; c(); }
  app.innerHTML = html; window.scrollTo(0, 0);
}

/* ---------- Telas ---------- */
// Primeira tela: um toque libera o som do aparelho.
function start() {
  show(`<div class="center" style="padding-top:24px">
      <h1>Turma do Hello</h1>
      ${avatar('bolt', true)}
      <button class="btn huge" id="play" aria-label="Começar">▶</button>
      <p class="muted">Inglês para quem ainda não lê. Aumente o volume!</p>
    </div>`);
  $('play').onclick = () => { home(); say('hello-bolt', 'toque'); };
}

function home() {
  const total = store.total;
  show(`
    <div class="top"><h1>Turma do Hello</h1><div class="total" aria-label="${total} estrelinhas">⭐ ${total}</div></div>
    <div class="hero">${avatar('bolt')}<div class="bubble">Hello! Let's play!</div>
      <button class="btn" id="hear" aria-label="Ouvir de novo">🔊</button></div>
    <div class="tiles">${UNITS.map(u => `
      <button class="tile" style="--c:${u.c}" data-u="${u.id}" aria-label="${u.t}: ${u.pt}">
        <span class="emo">${u.emo}</span><span class="t">${u.t}</span>
        <span class="st">${starStr(store.stars[u.id] || 0)}</span>
      </button>`).join('')}</div>
    <details><summary>Para os pais</summary>
      <p class="muted">A criança não precisa ler: o personagem fala as instruções em português e as palavras em inglês.
      Cada lição leva uns 5 minutos e ensina 6 palavras, 3 de cada vez. Uma lição por dia é o bastante; repetir a mesma lição
      em dias seguidos ajuda muito nessa idade. Sente junto e repita as palavras em voz alta com a criança.</p>
      <p class="muted">Cada acerto vale uma estrelinha ⭐ com festa e parabéns. ${canListen()
        ? 'Depois de ouvir a palavra, a criança toca no 🎤 e repete. O app mostra ✅ se entendeu a palavra, ou 🔁 para tentar de novo. O reconhecimento de voz erra bastante com crianças pequenas: use como incentivo, não como nota.'
        : 'Aqui o microfone não está disponível, então quem confere a fala é você: quando a criança repetir a palavra, toque no ✅ para ela ganhar a estrelinha, ou no 🔁 para ouvir de novo. Para o app conferir a fala sozinho, abra no navegador Chrome (computador ou Android) e permita o microfone.'}</p>
    </details>`);
  $('hear').onclick = () => say('lets-play', 'toque');
  app.querySelectorAll('.tile').forEach(b => b.onclick = () => lesson(UNITS.find(u => u.id === b.dataset.u)));
}

/* Uma lição: apresenta 3 palavras, pratica as 3, apresenta mais 3, pratica, e termina misturando tudo.
   Cada acerto (falar a palavra ou achar a figura) vale uma estrelinha. */
function lesson(u) {
  const [g1, g2] = [u.words.slice(0, 3), u.words.slice(3)];
  const steps = [];
  for (const g of [g1, g2]) {
    g.forEach(w => steps.push({ teach: w }));
    shuffle(g).forEach((w, i) => steps.push({ find: w, pool: g, n: i ? 3 : 2 }));
  }
  shuffle(u.words).slice(0, 4).forEach(w => steps.push({ find: w, pool: u.words, n: 4 }));
  let i = 0, miss = 0, got = 0;
  const top = () => `<div class="top"><button class="btn ghost" id="home" aria-label="Voltar ao início">🏠</button>
    <div class="bar" role="progressbar" aria-valuenow="${i}" aria-valuemax="${steps.length}"><i style="width:${i / steps.length * 100}%"></i></div>
    <div class="count" id="count" aria-label="${got} estrelinhas">⭐ ${got}</div>
    <button class="btn" id="hear" aria-label="Ouvir de novo">🔊</button></div>`;
  const next = () => { if (++i < steps.length) return step(); finish(); };
  // Acertou: estrelinha, festa e parabéns falado. A primeira da lição explica o prêmio.
  function reward(id) {
    got++; store.total++; save();
    const c = $('count'); if (c) { c.textContent = '⭐ ' + got; c.classList.add('bump'); }
    party();
    say('yes', id, ...(got === 1 ? ['p5', 'estrelinha'] : [praise()]));
    live.textContent = 'Parabéns! Ganhou uma estrelinha';
    later(next, got === 1 ? 4600 : 3400);
  }

  function step() {
    const s = steps[i];
    const intro = i === 0 ? ['hello-' + u.host, 'learn-' + u.id] : [];
    if (s.teach) {
      const w = s.teach, id = wid(w), mic = canListen();
      show(`${top()}
        <div class="hero">${avatar(u.host)}<div class="bubble">${w[0]}</div></div>
        <button class="card" id="card" aria-label="Ouvir ${w[0]}">${pic(u, w)}<span class="badge" id="badge" hidden></span></button>
        <div class="row">
          <button class="btn ghost rep" id="rep" aria-label="Ouvir de novo">🔁</button>
          ${mic ? '<button class="btn mic" id="mic" aria-label="Falar no microfone">🎤</button><button class="btn go" id="next" aria-label="Próxima" hidden>➜</button>'
                : '<button class="btn said" id="said" aria-label="A criança falou a palavra">✅</button>'}
        </div>`);
      const speak = () => say(...intro, 'escute', id, id, mic ? 'mic' : 'fala', id, ...(mic ? [] : ['verde']));
      const again = () => say('escute', id, id);
      speak();
      $('card').onclick = () => say(id);
      $('hear').onclick = speak;
      $('rep').onclick = again;
      let done = false;
      const badge = t => { const b = $('badge'); b.textContent = t; b.hidden = false; };
      const win = () => { if (done) return; done = true; $('card').classList.add('ok'); badge('✅'); reward(id); };
      if (!mic) {
        $('said').onclick = win;   // sem microfone, quem confere é o adulto
      } else {
        let tries = 0, busy = false;
        const reveal = () => { const n = $('next'); if (n) n.hidden = false; };
        $('next').onclick = () => { if (!done) next(); };
        later(reveal, 20000 + (intro.length ? 4000 : 0));
        $('mic').onclick = () => {
          if (busy || done) return;
          busy = true; hush(); $('badge').hidden = true; $('mic').classList.add('on'); live.textContent = 'Ouvindo';
          cancelListen = listen(w[0], ok => {
            cancelListen = null; busy = false;
            const m = $('mic'); if (!m) return;
            m.classList.remove('on');
            if (ok === null) { micOff = true; return step(); }   // microfone indisponível: volta no modo em que o adulto confere
            if (ok) { m.hidden = true; $('next').hidden = true; return win(); }
            badge('🔁'); live.textContent = 'Ainda não. Tente de novo';
            if (++tries < 2) return say('quase', id, id);
            say('boa', id); reveal();   // pode tentar de novo no microfone ou seguir
          });
        };
      }
    } else {
      const w = s.find, id = wid(w);
      const opts = shuffle([w, ...shuffle(s.pool.filter(x => x !== w)).slice(0, s.n - 1)]);
      show(`${top()}
        <div class="hero">${avatar(u.host)}<div class="bubble">${w[0]}?</div></div>
        <div class="choices${opts.length === 2 ? ' two' : ''}">${opts.map((o, k) => `<button class="choice" data-k="${k}" aria-label="Figura ${k + 1}">${pic(u, o)}</button>`).join('')}</div>`);
      const ask = () => say('cade', id);
      ask();
      $('hear').onclick = ask;
      let locked = false, wrong = 0;
      const btns = [...app.querySelectorAll('.choice')];
      btns.forEach(b => b.onclick = () => {
        if (locked) return;
        const o = opts[b.dataset.k];
        if (o !== w) {
          miss++; wrong++; b.classList.add('bad'); b.disabled = true;
          say('esse', wid(o), 'cade', id);
          live.textContent = 'Tente outra figura';
          if (wrong >= 2) btns[opts.indexOf(w)].classList.add('hint');   // ajuda depois de dois erros
          return;
        }
        locked = true; b.classList.remove('hint'); b.classList.add('ok');
        reward(id);
      });
    }
    $('home').onclick = () => { hush(); home(); };
  }

  function finish() {
    const stars = miss <= 2 ? 3 : miss <= 6 ? 2 : 1;
    store.stars[u.id] = Math.max(store.stars[u.id] || 0, stars); save();
    show(`<div class="center" style="padding-top:16px">
        ${avatar(u.host, true)}
        <div class="bigstars" aria-label="${stars} de 3 estrelas">${starStr(stars)}</div>
        <h1>Great job!</h1>
        <div class="total" aria-label="${got} estrelinhas nesta lição">⭐ × ${got}</div>
        <div class="row">
          <button class="btn ghost" id="again" aria-label="Brincar de novo">🔁</button>
          <button class="btn go" id="home" aria-label="Voltar ao início">🏠</button>
        </div>
      </div>`);
    party(true);
    say('great', 'p5', 's' + stars, 'bye');
    $('again').onclick = () => lesson(u);
    $('home').onclick = () => { hush(); home(); };
  }
  step();
}

start();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
}
</script>
<!--APP:END-->
